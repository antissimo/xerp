name: xerp

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xerp}
      POSTGRES_DB: ${POSTGRES_DB:-xerp}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Not published to the host on purpose: the API is the only way in.

  api:
    build:
      context: .
      dockerfile: src/Xerp.Api/Dockerfile
    environment:
      # Platform admin key for /api/v1/admin/*. Unset or shorter than 32 characters = admin routes reject everything.
      Xerp__AdminKey: ${XERP_ADMIN_KEY:-}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-xerp};Username=${POSTGRES_USER:-xerp};Password=${POSTGRES_PASSWORD:-xerp}
    ports:
      - "127.0.0.1:${XERP_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
